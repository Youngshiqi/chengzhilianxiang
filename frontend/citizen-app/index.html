<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CityRepair · 城市设施报修</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>" />
  <!-- Google Fonts: Chakra Petch (display/mono) + Noto Sans SC (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <!-- 全局噪点纹理覆盖层 -->
  <div class="noise-overlay"></div>
  <!-- 高德 JS API v2.0：逆地理编码 + 地理定位 -->
  <script>
    window._AMapSecurityConfig = {
      securityJsCode: '167a1003441359b5625504e95d0d1c27',
    }
    // 抑制 Chrome Canvas2D willReadFrequently 警告（高德地图内部使用 getImageData）
    try {
      const origGetContext = HTMLCanvasElement.prototype.getContext
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (type === '2d') {
          attrs = Object.assign({}, attrs || {}, { willReadFrequently: true })
        }
        return origGetContext.call(this, type, attrs)
      }
    } catch (e) {}
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=1cf2e7ad1f26d3a843c513f9d1e5eda9&plugin=AMap.Geocoder,AMap.Geolocation,AMap.Marker"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
