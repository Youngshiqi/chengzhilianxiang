# ============================================================
# 前端 Nginx 站点配置：三端静态托管 + /api 反向代理到后端
# ============================================================

# 后端上游（docker 网络内的服务名 backend）
upstream city_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # 图片/视频上传体积（与后端 OSS_MAX_FILE_SIZE_MB 对齐，留余量）
    client_max_body_size 20m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/x-javascript
               image/svg+xml application/wasm;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://city_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 管理端 /admin/ ----------
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- 维修员端 /worker/ ----------
    location /worker/ {
        try_files $uri $uri/ /worker/index.html;
    }

    # ---------- 市民端 /（根路径） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
