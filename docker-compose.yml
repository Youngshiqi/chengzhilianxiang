# ============================================================
# 城市公共设施智能报修与派单系统 - Docker Compose 编排
# 作用：一键启动项目所需全部基础设施
# ============================================================

version: "3.8"

services:
  # ---- MySQL 8.4：关系型数据库 ----
  mysql:
    image: mysql:8.4.9
    container_name: city_repair_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: city_repair
      MYSQL_USER: city_repair
      MYSQL_PASSWORD: city_repair_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ---- Redis 7.4：缓存 ----
  redis:
    image: redis:7.4.9
    container_name: city_repair_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis_2026

  # ---- Elasticsearch 8.12：全文搜索引擎 ----
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: city_repair_es
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ---- RabbitMQ 3.12：消息队列 ----
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: city_repair_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123456
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ---- MongoDB 6：文档存储 ----
  mongodb:
    image: mongo:6
    container_name: city_repair_mongo
    environment:
      MONGO_INITDB_DATABASE: city_repair
      MONGO_INITDB_ROOT_USERNAME: city_repair
      MONGO_INITDB_ROOT_PASSWORD: city_repair_2026
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ---- MinIO：OSS 对象存储 ----
  minio:
    image: minio/minio
    container_name: city_repair_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  redis_data:
  es_data:
  rabbitmq_data:
  mongo_data:
  minio_data: